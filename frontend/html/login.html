<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BdayLoop - Вход</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
<main class="container">
    <h1>BdayLoop</h1>
    <div class="grid">
    <section>
    <article>
        <h2>Вход</h2>
        <form id="loginForm">
            <label>Логин <input type="text" id="loginUsername" required></label>
            <label>Пароль <input type="password" id="loginPassword" required></label>
            <button type="submit">Войти</button>
        </form>
    </article>
    </section>
    <section>
    <article>
        <h2>Регистрация</h2>
        <form id="registerForm">
            <label>Имя <input type="text" id="regName" required></label>
            <label>Дата рождения <input type="date" id="regBirthday"></label>
            <label>Логин <input type="text" id="regUsername" required></label>
            <label>Пароль <input type="password" id="regPassword" required></label>
            <button type="submit">Зарегистрироваться</button>
        </form>
    </article>
    </section>
    </div>
    <p id="message"></p>
</main>

<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
