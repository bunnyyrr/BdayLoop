<!DOCTYPE html>

        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

<body>
<nav class="container">

  <ul>

<main class="container">
  <h2>Массовый импорт пользователей</h2>
  <p>Вставь JSON-массив: <code>[{"name": "...", "birthday": "ГГГГ-ММ-ДД", "username": "...", "password": "...", "role": "USER"}]</code> (<code>role</code> необязателен)</p>

  <form id="importForm">
    <textarea id="importJson" rows="10" required></textarea>
    <button type="submit">Импортировать</button>
  </form>

  <div id="importResult"></div>
</main>

<script src="../js/api.js"></script>
