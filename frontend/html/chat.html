<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BdayLoop - Чат</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
<nav class="container">
  <ul><li><a href="#" id="backLink"><- Назад к профилю пользователя</a></li></ul>
  <ul>
    <li><button id="logoutBtn" class="secondary">Выйти</button></li>
  </ul>
</nav>

<main class="container">
  <h2>Обсуждение подарка для <span id="subjectName">Имя</span></h2>
  <div id="messagesList" style="min-height: 300px; max-height: 400px; overflow-y: auto; border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; text-align: center; color: #888;">
    Сообщений пока нет...
  </div>
<form id="sendMessageForm">
  <input type="text" id="messageText" placeholder="Написать сообщение..." required>
  <button type="submit">Отправить</button>
</form>
</main>
<script src="../js/api.js"></script>
<script src="../js/chat.js"></script>
</body>
</html>
