spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      pool-name: bdayloop-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    ru.bdayloop: DEBUG
    org.hibernate.SQL: DEBUG